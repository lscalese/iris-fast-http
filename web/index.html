<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Demo &mdash; ObjectScript</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: #f4f4f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center;
        }

        #main-wrapper {
            width: 100%;
            max-width: 860px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* -- Header -- */
        header {
            padding: 14px 20px 0;
            border-bottom: 1px solid #ddd;
            background: white;
        }
        header h1 {
            margin: 0 0 12px;
            font-size: 1.1rem;
            color: #333;
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 4px;
        }
        .tab-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px 6px 0 0;
            background: #e9e9eb;
            color: #555;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.15s;
        }
        .tab-btn:hover { background: #d5d5d8; }
        .tab-btn.active {
            background: white;
            color: #007bff;
            border-bottom: 2px solid white;
            margin-bottom: -1px;
        }

        /* -- Tab panels -- */
        .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .tab-panel.active { display: flex; }

        /* -- Shared action bar -- */
        .action-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }
        .badge {
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            background: #e9e9eb;
            color: #666;
        }
        .badge.connected { background: #d4edda; color: #155724; }
        .badge.error     { background: #f8d7da; color: #721c24; }

        button.primary {
            padding: 8px 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        button.primary:disabled { background: #ccc; cursor: default; }
        button.danger {
            padding: 8px 18px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ====================================
           Tab 1 - Chat
        ==================================== */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            align-self: flex-end;
            background: #007bff;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            align-self: flex-start;
            background: #e9e9eb;
            color: #333;
            border-bottom-left-radius: 2px;
            white-space: pre-wrap;
        }
        .welcome-msg { text-align: center; color: #888; margin-top: 50px; }
        #chat-input-bar {
            padding: 16px 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }
        #chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            outline: none;
        }

        /* ====================================
           Tab 2 - Raw EventSource
        ==================================== */
        #eventsource-output {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            font-size: 1.1rem;
            color: #222;
            line-height: 1.7;
        }
        #eventsource-output .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #007bff;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ====================================
           Tab 3 - SSE Protocol
        ==================================== */
        #protocol-output {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            background: #1e1e2e;
            font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
            font-size: 0.85rem;
        }
        .proto-line {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } }
        .proto-ts {
            color: #6c7086;
            min-width: 68px;
            user-select: none;
            flex-shrink: 0;
        }
        .proto-text { color: #cdd6f4; }
        .proto-text.event-line  { color: #cba6f7; }
        .proto-text.data-line   { color: #a6e3a1; }
        .proto-text.empty-line  { color: #45475a; font-style: italic; }
        .proto-text.done-line   { color: #fab387; }
        #protocol-placeholder {
            color: #45475a;
            font-style: italic;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div id="main-wrapper">
    <header>
        <h1>SSE Demo &mdash; ObjectScript &amp; IRIS</h1>
        <div class="tabs">
            <button class="tab-btn active" data-tab="chat">Chat (fetch POST)</button>
            <button class="tab-btn" data-tab="eventsource">EventSource (GET)</button>
            <button class="tab-btn" data-tab="protocol">Raw SSE Protocol</button>
        </div>
    </header>

    <!-- Tab 1 - Chat -->
    <div id="panel-chat" class="tab-panel active">
        <div id="chat-container">
            <div class="welcome-msg" id="welcome-msg">
                <h2>Ready?</h2>
                <p>Ask a question to start the conversation.</p>
            </div>
        </div>
        <div id="chat-input-bar">
            <input type="text" id="chat-input" placeholder="Your message..." autocomplete="off">
            <button class="primary" id="send-btn">Send</button>
        </div>
    </div>

    <!-- Tab 2 - Raw EventSource -->
    <div id="panel-eventsource" class="tab-panel">
        <div class="action-bar">
            <button class="primary" id="es-start-btn">Start stream</button>
            <button class="danger" id="es-stop-btn" disabled>Stop</button>
            <span class="badge" id="es-badge">Disconnected</span>
        </div>
        <div id="eventsource-output">
            <span id="es-placeholder" style="color:#aaa;font-style:italic">
                Click "Start" to open an EventSource connection to <code>/csp/demo/sse/test</code>.
                Tokens arrive one by one (~1s apart).
            </span>
        </div>
    </div>

    <!-- Tab 3 - Raw SSE Protocol -->
    <div id="panel-protocol" class="tab-panel">
        <div class="action-bar">
            <button class="primary" id="proto-start-btn">Start</button>
            <button class="danger" id="proto-stop-btn" disabled>Stop</button>
            <span class="badge" id="proto-badge">Disconnected</span>
        </div>
        <div id="protocol-output">
            <div id="protocol-placeholder">
                Raw SSE frames will appear here with timestamps.
            </div>
        </div>
    </div>
</div>

<script>
const BASE = window.location.origin + "/csp/demo";

/* -----------------------------------------------
   Tab navigation
----------------------------------------------- */
document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
});

/* -----------------------------------------------
   Tab 1 - Chat (fetch POST + ReadableStream)
----------------------------------------------- */
const chatContainer = document.getElementById("chat-container");
const chatInput     = document.getElementById("chat-input");
const sendBtn       = document.getElementById("send-btn");
const welcomeMsg    = document.getElementById("welcome-msg");
let messageHistory  = [];

function appendMessage(role, text) {
    if (welcomeMsg) welcomeMsg.style.display = "none";
    const div = document.createElement("div");
    div.className = `message ${role}-message`;
    div.textContent = text;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    appendMessage("user", text);
    chatInput.value = "";
    messageHistory.push({ role: "user", content: text });

    const aiDiv = appendMessage("ai", "");
    sendBtn.disabled = true;

    try {
        const res = await fetch(`${BASE}/v1/chat/completions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "gpt-4o", messages: messageHistory, stream: true })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let full = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            for (const line of decoder.decode(value, { stream: true }).split("\n")) {
                if (!line.startsWith("data: ")) continue;
                const data = line.slice(6).trim();
                if (data === "[DONE]") break;
                try {
                    const content = JSON.parse(data).choices[0]?.delta?.content || "";
                    full += content;
                    aiDiv.textContent = full;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch {}
            }
        }
        if (full) messageHistory.push({ role: "assistant", content: full });
    } catch (e) {
        aiDiv.textContent = "Error: " + e.message;
        aiDiv.style.color = "red";
    } finally {
        sendBtn.disabled = false;
        chatInput.focus();
    }
}

sendBtn.addEventListener("click", sendMessage);
chatInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

/* -----------------------------------------------
   Tab 2 - EventSource (GET)
----------------------------------------------- */
const esStartBtn    = document.getElementById("es-start-btn");
const esStopBtn     = document.getElementById("es-stop-btn");
const esBadge       = document.getElementById("es-badge");
const esOutput      = document.getElementById("eventsource-output");
const esPlaceholder = document.getElementById("es-placeholder");
let esSource   = null;
let esTextNode = null;
let esCursor   = null;

function esSetBadge(state) {
    esBadge.textContent = state === "connected" ? "Connected" : state === "error" ? "Error" : "Disconnected";
    esBadge.className   = "badge" + (state === "connected" ? " connected" : state === "error" ? " error" : "");
}

esStartBtn.addEventListener("click", () => {
    if (esSource) return;
    if (esPlaceholder) esPlaceholder.remove();

    esOutput.innerHTML = "";
    esTextNode = document.createTextNode("");
    esCursor   = document.createElement("span");
    esCursor.className = "cursor";
    esOutput.appendChild(esTextNode);
    esOutput.appendChild(esCursor);

    esSource = new EventSource(`${BASE}/sse/test`);
    esSetBadge("connected");
    esStartBtn.disabled = true;
    esStopBtn.disabled  = false;

    esSource.onmessage = e => {
        if (e.data === "[DONE]") { esStop(); return; }
        try {
            const content = JSON.parse(e.data).choices[0]?.delta?.content || "";
            esTextNode.textContent += content;
            esOutput.scrollTop = esOutput.scrollHeight;
        } catch {}
    };

    esSource.addEventListener("done", () => esStop());

    esSource.onerror = () => {
        esSetBadge("error");
        esStop();
    };
});

function esStop() {
    if (esSource) { esSource.close(); esSource = null; }
    if (esCursor) { esCursor.remove(); esCursor = null; }
    esSetBadge("disconnected");
    esStartBtn.disabled = false;
    esStopBtn.disabled  = true;
}

esStopBtn.addEventListener("click", esStop);

/* -----------------------------------------------
   Tab 3 - Raw SSE Protocol (fetch GET)
----------------------------------------------- */
const protoStartBtn = document.getElementById("proto-start-btn");
const protoStopBtn  = document.getElementById("proto-stop-btn");
const protoBadge    = document.getElementById("proto-badge");
const protoOutput   = document.getElementById("protocol-output");
let protoT0 = null;

function protoSetBadge(state) {
    protoBadge.textContent = state === "connected" ? "Connected" : state === "error" ? "Error" : "Disconnected";
    protoBadge.className   = "badge" + (state === "connected" ? " connected" : state === "error" ? " error" : "");
}

function protoAddLine(text) {
    const elapsed = protoT0 !== null ? `+${Date.now() - protoT0}ms` : "";
    const row = document.createElement("div");
    row.className = "proto-line";

    const ts = document.createElement("span");
    ts.className   = "proto-ts";
    ts.textContent = elapsed;

    const content = document.createElement("span");
    content.className = "proto-text";
    if (text === "") {
        content.classList.add("empty-line");
        content.textContent = "(empty line -- end of event)";
    } else if (text.startsWith("event:")) {
        content.classList.add("event-line");
        content.textContent = text;
    } else if (text.startsWith("data: [DONE]")) {
        content.classList.add("done-line");
        content.textContent = text;
    } else if (text.startsWith("data:")) {
        content.classList.add("data-line");
        content.textContent = text;
    } else {
        content.textContent = text;
    }

    row.appendChild(ts);
    row.appendChild(content);
    protoOutput.appendChild(row);
    protoOutput.scrollTop = protoOutput.scrollHeight;
}

// EventSource is used here instead of fetch+ReadableStream because browsers
// buffer fetch chunks internally, causing all lines to arrive at once.
// EventSource processes the SSE wire format natively and fires per-event,
// so we reconstruct the raw protocol lines from the parsed event fields.
let protoSource = null;

protoStartBtn.addEventListener("click", () => {
    const placeholder = document.getElementById("protocol-placeholder");
    if (placeholder) placeholder.remove();
    protoOutput.innerHTML = "";

    protoT0 = Date.now();
    protoSetBadge("connected");
    protoStartBtn.disabled = true;
    protoStopBtn.disabled  = false;

    protoSource = new EventSource(`${BASE}/sse/test`);

    protoSource.onmessage = e => {
        if (e.data === "[DONE]") {
            protoAddLine("data: [DONE]");
            protoAddLine("");
            protoStop();
            return;
        }
        protoAddLine("data: " + e.data);
        protoAddLine("");
    };

    protoSource.addEventListener("done", e => {
        protoAddLine("event: done");
        protoAddLine("data: " + (e.data || "[DONE]"));
        protoAddLine("");
        protoStop();
    });

    protoSource.onerror = () => {
        protoSetBadge("error");
        protoStop();
    };
});

function protoStop() {
    if (protoSource) { protoSource.close(); protoSource = null; }
    protoSetBadge("disconnected");
    protoStartBtn.disabled = false;
    protoStopBtn.disabled  = true;
}

protoStopBtn.addEventListener("click", protoStop);
</script>
</body>
</html>
